<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passageiros | Gestão de Transporte</title>
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <main class="app-shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">Gestão de Transporte Escolar</p>
        <h1>Passageiros</h1>
      </div>
      <button id="logout-button" class="secondary" type="button">Sair</button>
    </header>
    <section class="panel">
      <div class="panel-heading">
        <h2>Alunos cadastrados</h2>
        <button id="refresh-button" class="secondary" type="button">Atualizar</button>
      </div>
      <p id="page-message" class="message" role="status" aria-live="polite"></p>
      <ul id="student-list" class="student-list"></ul>
    </section>
    <section class="panel">
      <h2 id="form-title">Cadastrar aluno</h2>
      <form id="student-form" class="student-form">
        <label>Nome<input name="nome" required></label>
        <label>Escola<input name="escola" required></label>
        <label>Valor<input name="valor" type="number" min="0" step="0.01" required></label>
        <label>Dia do vencimento<input name="vencimento" type="number" min="1" max="31" required></label>
        <label>Turma<input name="turma"></label>
        <label>Professora<input name="professora"></label>
        <label>Responsável<input name="responsavel" required></label>
        <label>Telefone<input name="telefone" type="tel" required></label>
        <button type="submit">Cadastrar aluno</button>
        <button id="cancel-edit-button" class="secondary" type="button" hidden>Cancelar edição</button>
      </form>
    </section>
  </main>
  <script src="/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/api-client.js"></script>
  <script src="/auth.js"></script>
</body>
</html>
