<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | Gestão de Transporte</title>
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="login-title">
      <p class="eyebrow">Gestão de Transporte Escolar</p>
      <h1 id="login-title">Entrar</h1>
      <p class="muted">Use seu e-mail e senha para acessar os passageiros.</p>
      <form id="login-form" novalidate>
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Entrar</button>
        <p id="login-message" class="message" role="alert" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/auth.js"></script>
</body>
</html>
