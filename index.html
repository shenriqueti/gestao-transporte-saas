<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha Van - Gestão</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="header-top">
        <div class="logo">
          <i class="ph-fill ph-van"></i>
          <h1 id="tituloPagina">Chamada</h1>
        </div>
        <span class="date-display" id="dataDisplay">Hoje</span>
      </div>

      <div class="stats-container" id="statsChamada">
        <div class="stat-card active">
          <span class="stat-label">Presentes Agora</span>
          <strong class="stat-value" id="contadorPresentes">0</strong>
        </div>
        <div class="stat-card">
          <span class="stat-label">Faltam</span>
          <strong class="stat-value" id="contadorFaltam">0</strong>
        </div>
      </div>

      <div class="stats-container hidden" id="statsAlunos">
        <div class="stat-card">
          <span class="stat-label">Total Cadastrado</span>
          <strong class="stat-value" id="totalAlunos">0</strong>
        </div>
      </div>

      <div class="stats-container hidden" id="statsFinanceiro">
        <div class="stat-card success">
          <span class="stat-label">Recebido</span>
          <strong class="stat-value" id="totalRecebido">R$ 0</strong>
        </div>
        <div class="stat-card alert">
          <span class="stat-label">Pendente</span>
          <strong class="stat-value" id="totalPendente">R$ 0</strong>
        </div>
      </div>
    </header>

    <main class="container">
      <section id="viewChamada">
        <div class="action-bar">
          <h2>Lista de Embarque</h2>
          <button id="btnLimpar" class="btn-secondary">
            <i class="ph ph-trash"></i> Limpar Dia
          </button>
        </div>
        <div id="listaChamada" class="lista-alunos"></div>
      </section>

      <section id="viewAlunos" class="hidden">
        <div class="action-bar">
          <h2>Meus Passageiros</h2>
          <button id="btnNovo" class="btn-primary">
            <i class="ph-bold ph-plus"></i> Novo Aluno
          </button>
        </div>
        <div id="listaGestao" class="lista-alunos"></div>
      </section>

      <section id="viewFinanceiro" class="hidden">
        <div class="month-selector">
          <button onclick="mudarMes(-1)">
            <i class="ph-bold ph-caret-left"></i>
          </button>
          <h2 id="mesAtualTexto">Janeiro 2026</h2>
          <button onclick="mudarMes(1)">
            <i class="ph-bold ph-caret-right"></i>
          </button>
        </div>
        <div id="listaFinanceiro" class="lista-alunos"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <a href="#" class="nav-item active" onclick="mudarAba('chamada')">
        <i class="ph-fill ph-check-circle"></i>
        <span>Chamada</span>
      </a>
      <a href="#" class="nav-item" onclick="mudarAba('alunos')">
        <i class="ph ph-users"></i>
        <span>Alunos</span>
      </a>
      <a href="#" class="nav-item" onclick="mudarAba('financeiro')">
        <i class="ph ph-currency-dollar"></i>
        <span>Finanças</span>
      </a>
    </nav>

    <div id="modalCadastro" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="tituloModal">Novo Passageiro</h3>
          <button id="btnFecharModal" class="close-btn">
            <i class="ph ph-x"></i>
          </button>
        </div>

        <form id="formAluno">
          <div class="form-group">
            <label>Nome da Criança</label>
            <input
              type="text"
              id="inputNome"
              placeholder="Ex: Enzo Gabriel"
              required
            />
          </div>

          <div class="form-group">
            <label>Escola</label>
            <input
              type="text"
              id="inputEscola"
              placeholder="Ex: Colégio Aplicação"
              required
            />
          </div>

          <div class="form-row">
            <div class="form-group" style="flex: 1">
              <label>Valor Mensal (R$)</label>
              <input type="number" id="inputValor" placeholder="350" required />
            </div>
            <div class="form-group" style="flex: 1">
              <label>Dia Vencimento</label>
              <input
                type="number"
                id="inputVencimento"
                placeholder="Ex: 10"
                min="1"
                max="31"
                required
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group" style="flex: 1">
              <label>Turma</label>
              <input type="text" id="inputTurma" placeholder="Ex: 101" />
            </div>
            <div class="form-group" style="flex: 1">
              <label>Professora</label>
              <input type="text" id="inputProf" placeholder="Ex: Tia Márcia" />
            </div>
          </div>

          <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0" />

          <div class="form-group">
            <label>Responsável Principal</label>
            <input
              type="text"
              id="inputResp"
              placeholder="Ex: Maria (Mãe)"
              required
            />
          </div>

          <div class="form-row">
            <div class="form-group" style="flex: 1">
              <label>WhatsApp 1</label>
              <input
                type="tel"
                id="inputTel1"
                placeholder="(21) 99999-9999"
                required
              />
            </div>
            <div class="form-group" style="flex: 1">
              <label>Telefone 2</label>
              <input type="tel" id="inputTel2" placeholder="(21) Recado" />
            </div>
          </div>

          <button type="submit" class="btn-full">Salvar Cadastro</button>
        </form>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
