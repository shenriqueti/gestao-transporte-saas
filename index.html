<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escolar Gestão - Alunos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Minha Van 🚐</h1>
    </header>

    <main class="container">
      <section class="acoes">
        <button id="btnNovo">+ Novo Aluno</button>
      </section>

      <section class="lista-alunos">
        <h2>Lista de Passageiros</h2>
        <div id="listaContainer">
          <div class="card-aluno">
            <div class="info">
              <strong>João Silva</strong>
              <span>Responsável: Maria</span>
            </div>
            <div class="status pago">Pago</div>
          </div>

          <div class="card-aluno">
            <div class="info">
              <strong>Ana Oliveira</strong>
              <span>Responsável: Carlos</span>
            </div>
            <div class="status pendente">Pendente</div>
          </div>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
